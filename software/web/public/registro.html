<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro diario · Semáforo de la Sala</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='1' width='16' height='30' rx='7' fill='%23243047'/%3E%3Ccircle cx='16' cy='8' r='4' fill='%23ef4444'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23facc15'/%3E%3Ccircle cx='16' cy='24' r='4' fill='%2322c55e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="estilos.css?v=2">
</head>
<body>
  <div class="contenedor">
    <header>
      <div class="marca">
        <div class="marca-icono" aria-hidden="true" style="font-size:1.6rem">📅</div>
        <div>
          <h1>Registro diario</h1>
          <p>Cómo estuvo la sala cada día</p>
        </div>
      </div>
      <div class="acciones">
        <a class="boton secundario" href="/">🚦 Volver al semáforo</a>
        <button id="boton-profe" class="boton secundario" type="button">👩‍🏫 Acceso profesora</button>
      </div>
    </header>

    <main class="registro">
      <!-- Calendario -->
      <section class="tarjeta">
        <div class="cal-cabecera">
          <button class="cal-flecha" id="mes-anterior" type="button" aria-label="Mes anterior">‹</button>
          <h2 id="titulo-mes">—</h2>
          <button class="cal-flecha" id="mes-siguiente" type="button" aria-label="Mes siguiente">›</button>
        </div>
        <div class="cal-semana" aria-hidden="true">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="cal-dias" id="dias"></div>
        <div class="cal-leyenda">
          La barrita de cada día muestra cuánto tiempo estuvo la sala en
          <span class="chip" style="background:var(--verde)"></span>verde,
          <span class="chip" style="background:var(--amarillo)"></span>amarillo y
          <span class="chip" style="background:var(--rojo)"></span>rojo.
          El número azul son los pedidos de ayuda.
        </div>
      </section>

      <!-- Reporte del dia elegido -->
      <section class="tarjeta" id="reporte" aria-live="polite">
        <div class="sin-datos">Cargando…</div>
      </section>
    </main>

    <footer>Taller de Diseño · Semáforo de ruido para la sala de clases</footer>
  </div>

  <script src="comun.js?v=2"></script>
  <script>
    const hoy = hoyEnChile();
    let mesVisto = hoy.slice(0, 7);       // "AAAA-MM"
    let diaElegido = null;                 // "AAAA-MM-DD"
    let diasDelMes = {};                   // resumen de cada día del mes visto
    let ultimoReporte = null;
    let grafico = null;

    // ---------- Fechas ----------
    const fechaUTC = f => new Date(f + "T12:00:00Z");
    function nombreMes(mes) {
      return mayuscula(fechaUTC(mes + "-01").toLocaleDateString("es-CL", { month: "long", year: "numeric", timeZone: "UTC" }));
    }
    function nombreDia(f) {
      return mayuscula(fechaUTC(f).toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }));
    }
    function moverMes(mes, n) {
      const d = fechaUTC(mes + "-01");
      d.setUTCMonth(d.getUTCMonth() + n);
      return d.toISOString().slice(0, 7);
    }
    const mayuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
    const pct = (parte, total) => total ? Math.round((parte / total) * 100) : 0;

    // Color que más se repitió (si empatan, gana el más ruidoso)
    function colorPrincipal(c) {
      const total = (c.verde || 0) + (c.amarillo || 0) + (c.rojo || 0);
      if (!total) return null;
      return ["rojo", "amarillo", "verde"].reduce((a, b) => (c[b] > c[a] ? b : a));
    }
    // true si en ese rato hubo más amarillo+rojo que verde
    const fueRuidoso = c => (c.amarillo + c.rojo) > 0 && (c.amarillo + c.rojo) >= c.verde;

    // ---------- Calendario ----------
    async function cargarMes() {
      $("titulo-mes").textContent = nombreMes(mesVisto);
      $("mes-siguiente").disabled = mesVisto >= hoy.slice(0, 7);
      try {
        const res = await fetch("/api/calendario?mes=" + mesVisto);
        const datos = await res.json();
        diasDelMes = {};
        (datos.dias || []).forEach(d => { diasDelMes[d.fecha] = d; });
      } catch (e) { diasDelMes = {}; }
      pintarCalendario();
    }

    function pintarCalendario() {
      const primero = fechaUTC(mesVisto + "-01");
      const vacios = (primero.getUTCDay() + 6) % 7;   // lunes = 0
      const ultimo = new Date(Date.UTC(primero.getUTCFullYear(), primero.getUTCMonth() + 1, 0)).getUTCDate();
      let html = "";
      for (let i = 0; i < vacios; i++) html += `<span class="cal-dia cal-vacio"></span>`;
      for (let n = 1; n <= ultimo; n++) {
        const f = `${mesVisto}-${String(n).padStart(2, "0")}`;
        const d = diasDelMes[f];
        const total = d ? d.verde + d.amarillo + d.rojo : 0;
        const futuro = f > hoy;
        const barra = total
          ? `<span class="mini">${["verde", "amarillo", "rojo"].map(c =>
              `<span style="width:${(d[c] / total) * 100}%;background:${COLORES[c]}"></span>`).join("")}</span>`
          : `<span class="mini"></span>`;
        const etiqueta = nombreDia(f) + (d ? `: ${pct(d.verde, total)}% tranquila, ${d.ayudas} pedidos de ayuda` : ": sin datos");
        html += `<button type="button" class="cal-dia${d ? " con-datos" : ""}${f === hoy ? " hoy" : ""}"
                   data-fecha="${f}" aria-pressed="${f === diaElegido}" aria-label="${escapar(etiqueta)}" ${futuro ? "disabled" : ""}>
                   <span>${n}</span>${barra}
                   ${d && d.ayudas ? `<span class="ayudas-dia" aria-hidden="true">${d.ayudas}</span>` : ""}
                 </button>`;
      }
      $("dias").innerHTML = html;
    }

    $("dias").addEventListener("click", ev => {
      const b = ev.target.closest(".cal-dia[data-fecha]");
      if (b && !b.disabled) elegirDia(b.dataset.fecha);
    });
    $("mes-anterior").onclick = () => { mesVisto = moverMes(mesVisto, -1); cargarMes(); };
    $("mes-siguiente").onclick = () => { mesVisto = moverMes(mesVisto, 1); cargarMes(); };

    function elegirDia(f) {
      diaElegido = f;
      history.replaceState(null, "", "#" + f);
      document.querySelectorAll(".cal-dia[data-fecha]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fecha === f));
      cargarReporte();
    }

    // ---------- Reporte del día ----------
    async function cargarReporte() {
      const f = diaElegido;
      try {
        const res = await fetch("/api/reporte?fecha=" + f, { headers: Profe.clave ? { "x-profe-clave": Profe.clave } : {} });
        const r = await res.json();
        if (f !== diaElegido) return;              // se eligió otro día mientras cargaba
        if (Profe.clave && !r.esProfe) Profe.guardar(null);   // la clave ya no sirve
        ultimoReporte = r;
        pintarReporte(r);
      } catch (e) {
        $("reporte").innerHTML = `<div class="sin-datos">No se pudo cargar el reporte. Revisa el internet.</div>`;
      }
    }

    function pintarReporte(r) {
      const s = r.resumen;
      const titulo = `<h2 class="reporte-titulo">${escapar(nombreDia(r.fecha))}</h2>`;
      if (!s.mediciones && !r.pedidos.length) {
        if (grafico) { grafico.destroy(); grafico = null; }
        $("reporte").innerHTML = titulo + `<div class="sin-datos">😴 Este día el semáforo no mandó datos.</div>`;
        return;
      }
      const total = s.verde + s.amarillo + s.rojo;
      const ruidoso = pct(s.amarillo + s.rojo, total);
      const atendidos = r.pedidos.filter(p => p.atendida_en);
      const espera = atendidos.length
        ? Math.round(atendidos.reduce((a, p) => a + (new Date(p.atendida_en) - new Date(p.pedida_en)), 0) / atendidos.length / 60000)
        : null;
      const peor = r.bloques.reduce((a, b) => (!a || b.promedio > a.promedio ? b : a), null);

      // Relación entre ruido y pedidos de ayuda
      const conDatos = r.pedidos.filter(p => p.ruidoAntes.verde + p.ruidoAntes.amarillo + p.ruidoAntes.rojo > 0);
      const trasRuido = conDatos.filter(p => fueRuidoso(p.ruidoAntes)).length;
      let conclusion;
      if (!r.pedidos.length) {
        conclusion = `No hubo pedidos de ayuda. La sala estuvo con ruido alto (amarillo o rojo) un ${ruidoso}% del tiempo.`;
      } else if (!conDatos.length) {
        conclusion = `Hubo ${r.pedidos.length} ${r.pedidos.length === 1 ? "pedido" : "pedidos"} de ayuda, pero el semáforo no midió ruido en los minutos anteriores.`;
      } else {
        conclusion = `<b>${trasRuido} de ${conDatos.length}</b> ${conDatos.length === 1 ? "pedido de ayuda llegó" : "pedidos de ayuda llegaron"} después de 10 minutos con ruido alto (amarillo o rojo). ` +
          `En todo el día la sala estuvo con ruido alto un <b>${ruidoso}%</b> del tiempo.`;
      }

      // Motivos (solo profesora)
      let motivosHtml = "";
      if (r.esProfe && r.pedidos.length) {
        const cuenta = {};
        r.pedidos.forEach(p => { const k = p.motivo || "sin"; cuenta[k] = (cuenta[k] || 0) + 1; });
        motivosHtml = `<div class="motivos-resumen">${Object.entries(cuenta).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
          k === "sin" ? `<span class="motivo-tag vacio">Sin motivo × ${n}</span>`
                      : `<span class="motivo-tag">${MOTIVOS[k].emoji} ${escapar(MOTIVOS[k].texto)} × ${n}</span>`).join("")}</div>`;
      }

      const filas = r.pedidos.map(p => {
        const c = p.ruidoAntes;
        const tot = c.verde + c.amarillo + c.rojo;
        const principal = colorPrincipal(c);
        const ruido = tot
          ? `<span class="nivel-tag ${principal}">${NOMBRES[principal]}</span><span class="nota-texto">${pct(c.amarillo + c.rojo, tot)}% con ruido alto</span>`
          : `<span class="nota-texto">Sin mediciones</span>`;
        const atendido = p.atendida_en
          ? `${hora(p.atendida_en, false)}<span class="nota-texto">esperó ${Math.max(0, Math.round((new Date(p.atendida_en) - new Date(p.pedida_en)) / 60000))} min</span>`
          : `<span class="nivel-tag rojo">Sin atender</span>`;
        let motivo;
        if (r.esProfe) {
          motivo = etiquetaMotivo(p.motivo) +
            (p.nota ? `<span class="nota-texto">${escapar(p.nota)}</span>` : "") +
            `<span class="nota-texto"><button class="link-boton" type="button" data-editar="${p.id}">${p.motivo ? "Cambiar" : "Anotar motivo"}</button></span>`;
        } else {
          motivo = p.tieneMotivo ? `<span class="motivo-tag">🔒 Anotado</span>` : `<span class="motivo-tag vacio">Sin motivo</span>`;
        }
        return `<tr><td>${hora(p.pedida_en, false)}</td><td>${ruido}</td><td>${atendido}</td><td>${motivo}</td></tr>`;
      }).join("");

      $("reporte").innerHTML = `
        <div class="fila-titulo">
          ${titulo}
          <button class="boton secundario" type="button" id="descargar">⬇️ Descargar (Excel)</button>
        </div>
        ${s.mediciones ? `
          <div class="barra" aria-hidden="true">
            <div style="background:var(--verde);width:${(s.verde / total) * 100}%"></div>
            <div style="background:var(--amarillo);width:${(s.amarillo / total) * 100}%"></div>
            <div style="background:var(--rojo);width:${(s.rojo / total) * 100}%"></div>
          </div>
          <div class="leyenda">
            <div class="leyenda-item"><strong>${pct(s.verde, total)}%</strong><small><span class="chip" style="background:var(--verde)"></span>Tranquila</small></div>
            <div class="leyenda-item"><strong>${pct(s.amarillo, total)}%</strong><small><span class="chip" style="background:var(--amarillo)"></span>Subiendo</small></div>
            <div class="leyenda-item"><strong>${pct(s.rojo, total)}%</strong><small><span class="chip" style="background:var(--rojo)"></span>Mucho ruido</small></div>
          </div>` : ""}
        <div class="cifras">
          <div class="cifra"><small>🕐 Horario medido</small><strong>${s.primera ? `${hora(s.primera, false)}–${hora(s.ultima, false)}` : "—"}</strong></div>
          <div class="cifra"><small>🙋 Pedidos de ayuda</small><strong>${r.pedidos.length}</strong></div>
          <div class="cifra"><small>⏱️ Espera promedio</small><strong>${espera === null ? "—" : espera + " min"}</strong></div>
          <div class="cifra"><small>📈 Más ruido a las</small><strong>${peor ? peor.hora : "—"}</strong></div>
        </div>
        <div class="conclusion ${trasRuido ? "" : "azul"}">${conclusion}</div>

        ${s.mediciones ? `
          <h3 style="margin-top:22px">Ruido durante el día</h3>
          <span class="etiqueta">Promedio cada 5 minutos · los puntos azules son pedidos de ayuda</span>
          <div class="grafico-caja"><canvas id="grafico-dia"></canvas></div>` : ""}

        <h3 style="margin-top:22px">Pedidos de ayuda</h3>
        ${!r.esProfe && r.pedidos.length ? `<p class="ayuda-nota">🔒 Los motivos solo los ven las profesoras. <button class="link-boton" type="button" id="entrar-motivos">Entrar con la clave</button></p>` : ""}
        ${motivosHtml}
        ${r.pedidos.length ? `
          <div class="tabla-caja">
            <table class="pedidos">
              <thead><tr><th>Hora</th><th>Ruido 10 min antes</th><th>Atendido</th><th>Motivo</th></tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>` : `<p class="ayuda-nota">Nadie pidió ayuda este día.</p>`}
      `;

      if (s.mediciones) dibujarGrafico(r);
      else if (grafico) { grafico.destroy(); grafico = null; }
      $("descargar").onclick = () => descargarCSV(r);
      const entrar = $("entrar-motivos");
      if (entrar) entrar.onclick = () => Profe.pedirClave();
    }

    // Bloque de 5 minutos ("09:35") en el que cae una hora
    function bloqueDe(fecha) {
      const [h, m] = hora(fecha, false).split(":").map(Number);
      return `${String(h).padStart(2, "0")}:${String(Math.floor(m / 5) * 5).padStart(2, "0")}`;
    }

    function dibujarGrafico(r) {
      if (grafico) grafico.destroy();
      const porHora = {};
      r.bloques.forEach(b => { porHora[b.hora] = b; });
      const pedidosPorBloque = {};
      r.pedidos.forEach(p => { const k = bloqueDe(p.pedida_en); (pedidosPorBloque[k] = pedidosPorBloque[k] || []).push(p); });
      const etiquetas = [...new Set([...Object.keys(porHora), ...Object.keys(pedidosPorBloque)])].sort();

      grafico = new Chart($("grafico-dia"), {
        type: "line",
        data: {
          labels: etiquetas,
          datasets: [
            {
              label: "Ruido promedio",
              data: etiquetas.map(k => porHora[k] ? Math.round(porHora[k].promedio * 10) / 10 : null),
              borderColor: "#94a3b8", borderWidth: 3, tension: 0.3, spanGaps: false,
              pointRadius: 4, pointBorderColor: "#fff", pointBorderWidth: 1.5,
              pointBackgroundColor: etiquetas.map(k => porHora[k] ? COLORES[colorPrincipal(porHora[k])] : "#94a3b8"),
              fill: true, backgroundColor: "rgba(148,163,184,.12)",
            },
            {
              label: "Pedido de ayuda",
              data: etiquetas.map(k => pedidosPorBloque[k] ? (porHora[k] ? porHora[k].promedio : 0) : null),
              showLine: false, pointRadius: 9, pointHoverRadius: 11,
              pointBackgroundColor: "#3b82f6", pointBorderColor: "#fff", pointBorderWidth: 3,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          animation: { duration: 300 },
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              label: ctx => {
                const k = etiquetas[ctx.dataIndex];
                if (ctx.datasetIndex === 1) {
                  const n = pedidosPorBloque[k].length;
                  return `🙋 ${n} ${n === 1 ? "pedido" : "pedidos"} de ayuda`;
                }
                const b = porHora[k];
                return b ? `Ruido ${formatearValor(ctx.parsed.y)} (${NOMBRES[colorPrincipal(b)]})` : "";
              },
            }},
          },
          scales: {
            x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { family: "Nunito", weight: 700 } } },
            y: { beginAtZero: true, grid: { color: "#f0e6d6" }, ticks: { font: { family: "Nunito", weight: 700 } } },
          },
        },
      });
    }

    // Archivo .csv que se abre en Excel (separado por ";" como usa Excel en Chile)
    function descargarCSV(r) {
      const celda = v => {
        const t = v === null || v === undefined ? "" : String(v);
        return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
      };
      const num = v => v === null || v === undefined ? "" : String(Math.round(v * 10) / 10).replace(".", ",");
      const lineas = [];
      lineas.push(["Registro del semáforo", nombreDia(r.fecha)]);
      lineas.push([]);
      lineas.push(["PEDIDOS DE AYUDA"]);
      lineas.push(["Hora del pedido", "Hora atendido", "Minutos de espera", "Ruido promedio 10 min antes", "% ruido alto 10 min antes", "Motivo", "Nota"]);
      r.pedidos.forEach(p => {
        const c = p.ruidoAntes, tot = c.verde + c.amarillo + c.rojo;
        lineas.push([
          hora(p.pedida_en),
          p.atendida_en ? hora(p.atendida_en) : "sin atender",
          p.atendida_en ? Math.round((new Date(p.atendida_en) - new Date(p.pedida_en)) / 60000) : "",
          num(c.promedio),
          tot ? pct(c.amarillo + c.rojo, tot) : "",
          r.esProfe ? (MOTIVOS[p.motivo] ? MOTIVOS[p.motivo].texto : "") : "(solo profesora)",
          r.esProfe ? (p.nota || "") : "",
        ]);
      });
      lineas.push([]);
      lineas.push(["RUIDO CADA 5 MINUTOS"]);
      lineas.push(["Hora", "Ruido promedio", "Ruido máximo", "Color principal", "Mediciones verde", "Mediciones amarillo", "Mediciones rojo"]);
      r.bloques.forEach(b => lineas.push([b.hora, num(b.promedio), num(b.maximo), NOMBRES[colorPrincipal(b)], b.verde, b.amarillo, b.rojo]));

      const texto = "﻿" + lineas.map(l => l.map(celda).join(";")).join("\r\n");
      const url = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `semaforo-${r.fecha}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Editar el motivo de un pedido desde la tabla
    $("reporte").addEventListener("click", async ev => {
      const b = ev.target.closest("[data-editar]");
      if (!b || !ultimoReporte) return;
      const p = ultimoReporte.pedidos.find(x => String(x.id) === b.dataset.editar);
      const m = await pedirMotivo({
        titulo: "Motivo del pedido de las " + hora(p.pedida_en, false),
        texto: "Elige por qué pidió ayuda el estudiante.",
        boton: "Guardar",
        motivo: p.motivo, nota: p.nota,
      });
      if (!m) return;
      const res = await Profe.enviar(`/api/asistencia/${p.id}/motivo`, m);
      if (res && !res.ok) alert("No se pudo guardar el motivo.");
      cargarReporte();
    });

    // ---------- Profesora ----------
    let primeraVez = true;
    Profe.alCambiar(clave => {
      const b = $("boton-profe");
      b.textContent = clave ? "👩‍🏫 Modo profesora · Salir" : "👩‍🏫 Acceso profesora";
      b.classList.toggle("modo-profe", !!clave);
      if (!primeraVez && diaElegido) cargarReporte();   // mostrar u ocultar los motivos
    });
    primeraVez = false;
    $("boton-profe").onclick = () => { if (Profe.clave) Profe.guardar(null); else Profe.pedirClave(); };

    // ---------- Inicio ----------
    (async () => {
      const pedido = location.hash.slice(1);
      if (/^\d{4}-\d{2}-\d{2}$/.test(pedido) && pedido <= hoy) {
        mesVisto = pedido.slice(0, 7);
        diaElegido = pedido;
      }
      await cargarMes();
      if (!diaElegido) {
        // Hoy, o el último día con datos del mes si hoy todavía no hay
        const conDatos = Object.keys(diasDelMes).filter(f => f <= hoy).sort();
        diaElegido = diasDelMes[hoy] || !conDatos.length ? hoy : conDatos[conDatos.length - 1];
      }
      elegirDia(diaElegido);
    })();

    // Si se está mirando el día de hoy, se actualiza solo cada 30 segundos
    setInterval(() => {
      if (diaElegido === hoy && !document.querySelector("dialog[open]")) { cargarMes(); cargarReporte(); }
    }, 30000);
  </script>
</body>
</html>
